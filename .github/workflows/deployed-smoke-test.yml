name: Deployed Smoke Test

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify API and Neon database readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            response="$(curl --silent --show-error --fail --max-time 12 https://nepse-ai-platform-api-lfsv.onrender.com/health/ready 2>/dev/null || true)"
            if [ -n "$response" ] && printf '%s' "$response" | python -c 'import json,os,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status") == "ready" and d.get("checks", {}).get("database") == "ok" and d.get("commit_sha") == os.environ["EXPECTED_COMMIT"] else 1)' ; then
              echo "API reports ready, database healthy, and deployed commit matches $EXPECTED_COMMIT."
              exit 0
            fi
            echo "API/database or deployed commit does not match $EXPECTED_COMMIT yet (attempt $attempt/40); retrying."
            sleep 15
          done
          echo "API did not become ready on the expected commit $EXPECTED_COMMIT with a healthy database."
          exit 1

      - name: Verify production automation overview contract
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            response="$(curl --silent --show-error --fail --max-time 12 https://nepse-ai-platform-api-lfsv.onrender.com/research/automation/overview 2>/dev/null || true)"
            if [ -n "$response" ] && printf '%s' "$response" | python -c '
          import json
          import sys
          payload = json.load(sys.stdin)
          market = payload.get("market_data", {})
          index = payload.get("nepse_index", {})
          forward = payload.get("forward_testing", {})
          horizons = forward.get("horizons", {})
          source = payload.get("source_diagnostics")
          assert isinstance(source, dict)
          assert "available" in source
          assert "status" in source
          assert "active_ordinary_shares" in market
          assert "coverage_pct" in market
          assert "latest_session_coverage_pct" in market
          assert "latest_session_gaps" in market
          assert isinstance(market["latest_session_gaps"], list)
          assert "latest_date" in index
          assert all(str(horizon) in horizons for horizon in (1, 5, 10, 20))
          assert "automation" in payload
          ' ; then
              echo "Production archive, index, signal-forward-test and automation overview is responding."
              exit 0
            fi
            echo "Automation overview not ready yet (attempt $attempt/40); retrying."
            sleep 15
          done
          echo "Automation overview did not return the expected production data contract."
          exit 1

      - name: Verify dashboard health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --silent --show-error --fail --max-time 12 https://nepse-ai-platform-dashboard.onrender.com/_stcore/health >/dev/null 2>&1; then
              echo "Dashboard health endpoint is responding."
              exit 0
            fi
            echo "Dashboard not ready yet (attempt $attempt/40); retrying."
            sleep 15
          done
          echo "Dashboard did not become healthy."
          exit 1
