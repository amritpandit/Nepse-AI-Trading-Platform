name: Deployed Smoke Test

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify API and Neon database readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            response="$(curl --silent --show-error --fail --max-time 12 https://nepse-ai-platform-api-lfsv.onrender.com/health/ready 2>/dev/null || true)"
            if [ -n "$response" ] && printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status") == "ready" and d.get("checks", {}).get("database") == "ok" else 1)' ; then
              echo "API reports ready and its database check is healthy."
              exit 0
            fi
            echo "API/database not ready yet (attempt $attempt/40); retrying."
            sleep 15
          done
          echo "API did not become ready with a healthy database."
          exit 1

      - name: Verify dashboard health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --silent --show-error --fail --max-time 12 https://nepse-ai-platform-dashboard.onrender.com/_stcore/health >/dev/null 2>&1; then
              echo "Dashboard health endpoint is responding."
              exit 0
            fi
            echo "Dashboard not ready yet (attempt $attempt/40); retrying."
            sleep 15
          done
          echo "Dashboard did not become healthy."
          exit 1
