name: NEPSE automated market scan

on:
  schedule:
    # 09:30 UTC = 15:15 Nepal time, after the normal trading session.
    - cron: "30 9 * * 0-4"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Optional full-history maintenance backfill; normally leave false because the price archive is already populated"
        required: false
        default: false
        type: boolean

# GitHub's short-lived OIDC identity replaces long-lived repository secrets.
permissions:
  contents: read
  id-token: write

concurrency:
  group: nepse-daily-market-scan
  cancel-in-progress: false

jobs:
  refresh-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate GitHub OIDC runner configuration
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" || (echo "GitHub OIDC URL is unavailable; verify id-token: write permission" && exit 1)
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" || (echo "GitHub OIDC request credential is unavailable" && exit 1)

      - name: Import all listed ordinary-share history in bounded batches
        id: market_import
        env:
          API_BASE: https://nepse-ai-platform-api-lfsv.onrender.com
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FULL_HISTORY: ${{ inputs.full_history || false }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          import requests


          def automation_headers() -> dict[str, str]:
              request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
              request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
              if not request_url or not request_token:
                  raise RuntimeError("GitHub Actions OIDC credentials are unavailable")
              response = requests.get(
                  request_url,
                  params={"audience": "nepse-ai-automation"},
                  headers={"Authorization": f"Bearer {request_token}"},
                  timeout=20,
              )
              response.raise_for_status()
              oidc_token = response.json().get("value")
              if not isinstance(oidc_token, str) or not oidc_token:
                  raise RuntimeError("GitHub did not issue an OIDC identity token")
              return {
                  "Authorization": f"Bearer {oidc_token}",
                  "X-Automation-Run-ID": os.environ["GITHUB_RUN_ID"],
              }


          base = os.environ["API_BASE"].rstrip("/")
          headers = automation_headers()
          full_history = os.environ.get("FULL_HISTORY", "false").lower() == "true"
          # Normal manual and scheduled runs refresh a rolling 14-calendar-day
          # window. Full-history is reserved for deliberate maintenance only.
          start_date = None
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" or not full_history:
              start_date = (
                  datetime.now(ZoneInfo("Asia/Kathmandu")) - timedelta(days=14)
              ).date().isoformat()

          offset = 0
          total_symbols = 0
          total_inserted = 0
          total_updated = 0
          expected_catalogue_count = None
          expected_catalogue_symbols: set[str] | None = None
          processed_symbols: set[str] = set()
          full_history_backfill_symbols: set[str] = set()

          for batch_number in range(100):
              response = requests.post(
                  f"{base}/research/automation/import-batch",
                  params={
                      "offset": offset,
                      "batch_size": 10,
                      **({"start_date": start_date} if start_date else {}),
                  },
                  headers=headers,
                  timeout=180,
              )
              response.raise_for_status()
              result = response.json()
              batch_catalogue_count = int(result.get("catalogue_symbols_count", 0))
              if batch_catalogue_count <= 0:
                  raise RuntimeError("Import response did not provide a valid source catalogue count")
              raw_catalogue_symbols = result.get("catalogue_symbols", [])
              if not isinstance(raw_catalogue_symbols, list):
                  raise RuntimeError("Import response catalogue symbols field is not a list")
              batch_catalogue_symbols = {
                  str(symbol).strip().upper()
                  for symbol in raw_catalogue_symbols
                  if str(symbol).strip()
              }
              if (
                  len(batch_catalogue_symbols) != batch_catalogue_count
                  or len(raw_catalogue_symbols) != batch_catalogue_count
              ):
                  raise RuntimeError("Source catalogue symbol set/count mismatch")
              if expected_catalogue_count is None:
                  expected_catalogue_count = batch_catalogue_count
                  expected_catalogue_symbols = batch_catalogue_symbols
              elif (
                  batch_catalogue_count != expected_catalogue_count
                  or batch_catalogue_symbols != expected_catalogue_symbols
              ):
                  raise RuntimeError("Source catalogue changed during the import run")

              batch_symbols = result.get("symbols", [])
              if not isinstance(batch_symbols, list):
                  raise RuntimeError("Import response symbols field is not a list")
              normalized_symbols = [str(symbol).strip().upper() for symbol in batch_symbols]
              if any(not symbol for symbol in normalized_symbols):
                  raise RuntimeError("Import response included a blank stock symbol")
              if len(set(normalized_symbols)) != len(normalized_symbols):
                  raise RuntimeError("Import batch returned duplicate stock symbols")
              duplicated_across_batches = processed_symbols.intersection(normalized_symbols)
              if duplicated_across_batches:
                  raise RuntimeError(
                      "Import pagination repeated symbols: "
                      + ", ".join(sorted(duplicated_across_batches))
                  )
              processed_symbols.update(normalized_symbols)

              batch_backfills = result.get("full_history_backfill_symbols", [])
              if not isinstance(batch_backfills, list):
                  raise RuntimeError("Full-history backfill audit field is not a list")
              full_history_backfill_symbols.update(
                  str(symbol).strip().upper()
                  for symbol in batch_backfills
                  if str(symbol).strip()
              )

              batch_succeeded = int(result.get("symbols_succeeded", 0))
              if len(normalized_symbols) != batch_succeeded:
                  raise RuntimeError(
                      "Import batch symbol list/count mismatch: "
                      f"{len(normalized_symbols)} != {batch_succeeded}"
                  )
              total_symbols += batch_succeeded
              total_inserted += int(result.get("rows_inserted", 0))
              total_updated += int(result.get("rows_updated", 0))
              if result.get("errors"):
                  raise RuntimeError(
                      "Import batch returned source errors: " + str(result["errors"])
                  )
              if int(result.get("symbols_succeeded", 0)) != int(
                  result.get("symbols_requested", 0)
              ):
                  raise RuntimeError(
                      "Import batch did not process every requested symbol"
                  )
              print(
                  {
                      "batch": batch_number + 1,
                      "offset": offset,
                      "symbols_succeeded": result.get("symbols_succeeded"),
                      "rows_inserted": result.get("rows_inserted"),
                      "rows_updated": result.get("rows_updated"),
                      "rows_rejected": result.get("rows_rejected"),
                      "errors": result.get("errors"),
                  },
                  flush=True,
              )

              next_offset = result.get("next_offset")
              if next_offset is None:
                  break
              offset = int(next_offset)
              time.sleep(1)
          else:
              raise RuntimeError("Safety stop: exceeded 100 import batches")

          if expected_catalogue_count is None or expected_catalogue_count <= 0:
              raise RuntimeError("Market-data import did not discover a valid source universe")
          if total_symbols != expected_catalogue_count:
              raise RuntimeError(
                  "Market-data import did not process the complete source universe: "
                  f"{total_symbols}/{expected_catalogue_count}"
              )
          if len(processed_symbols) != expected_catalogue_count:
              raise RuntimeError(
                  "Imported unique-symbol count does not match the source catalogue: "
                  f"{len(processed_symbols)}/{expected_catalogue_count}"
              )
          if expected_catalogue_symbols is None or processed_symbols != expected_catalogue_symbols:
              missing_symbols = sorted((expected_catalogue_symbols or set()) - processed_symbols)
              unexpected_symbols = sorted(processed_symbols - (expected_catalogue_symbols or set()))
              raise RuntimeError(
                  "Imported symbol set does not match the source catalogue: "
                  f"missing={missing_symbols}, unexpected={unexpected_symbols}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"expected_symbols={expected_catalogue_count}\n")
              output.write(
                  f"full_history_backfills={len(full_history_backfill_symbols)}\n"
              )

          print(
              {
                  "import_complete": True,
                  "source_catalogue_symbols": expected_catalogue_count,
                  "unique_symbols_imported": len(processed_symbols),
                  "symbols_succeeded": total_symbols,
                  "full_history_backfills": len(full_history_backfill_symbols),
                  "full_history_backfill_symbols": sorted(full_history_backfill_symbols),
                  "rows_inserted": total_inserted,
                  "rows_updated": total_updated,
              },
              flush=True,
          )
          PY

      - name: Run full-universe AI scan and update forward-testing ledger
        env:
          API_BASE: https://nepse-ai-platform-api-lfsv.onrender.com
          GITHUB_RUN_ID: ${{ github.run_id }}
          EXPECTED_SYMBOLS: ${{ steps.market_import.outputs.expected_symbols }}
        run: |
          python - <<'PY'
          import os

          import requests


          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          if not request_url or not request_token:
              raise RuntimeError("GitHub Actions OIDC credentials are unavailable")
          token_response = requests.get(
              request_url,
              params={"audience": "nepse-ai-automation"},
              headers={"Authorization": f"Bearer {request_token}"},
              timeout=20,
          )
          token_response.raise_for_status()
          oidc_token = token_response.json().get("value")
          if not isinstance(oidc_token, str) or not oidc_token:
              raise RuntimeError("GitHub did not issue an OIDC identity token")

          response = requests.post(
              f"{os.environ['API_BASE'].rstrip('/')}/research/automation/scan",
              headers={
                  "Authorization": f"Bearer {oidc_token}",
                  "X-Automation-Run-ID": os.environ["GITHUB_RUN_ID"],
              },
              timeout=600,
          )
          response.raise_for_status()
          result = response.json()
          print(
              {
                  "as_of": result.get("as_of"),
                  "eligible_stocks": result.get("eligible_stocks"),
                  "stocks_analyzed": result.get("stocks_analyzed"),
                  "scan_coverage_pct": result.get("scan_coverage_pct"),
                  "snapshots_saved": result.get("snapshots_saved"),
                  "analysis_failures": result.get("analysis_failures"),
                  "signal_counts": result.get("signal_counts"),
                  "outcome_refresh": result.get("outcome_refresh"),
              },
              flush=True,
          )
          expected = int(os.environ["EXPECTED_SYMBOLS"])
          eligible = int(result.get("eligible_stocks", 0))
          analyzed = int(result.get("stocks_analyzed", 0))
          saved = int(result.get("snapshots_saved", 0))
          if not result.get("scan_complete"):
              raise RuntimeError("API did not certify complete full-universe scan coverage")
          if eligible != expected or analyzed != expected or saved != expected:
              raise RuntimeError(
                  "Full-universe scan count mismatch: "
                  f"expected={expected}, eligible={eligible}, "
                  f"analyzed={analyzed}, snapshots_saved={saved}"
              )
          failures = result.get("analysis_failures") or []
          if failures:
              raise RuntimeError(
                  "Stock analysis failures remain: " + str(failures[:20])
              )
          PY
