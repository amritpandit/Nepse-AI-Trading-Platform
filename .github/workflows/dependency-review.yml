name: Dependency Vulnerability Audit

# The GitHub dependency-review API requires GitHub Advanced Security for
# private repositories. Use pip-audit so private repositories still get a
# real vulnerability scan without depending on that API entitlement.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Audit ${{ matrix.name }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API runtime
            requirements: requirements-api.txt
          - name: Full ML/runtime
            requirements: requirements.txt
          - name: Dashboard
            requirements: dashboard/requirements.txt
          - name: Development and tests
            requirements: requirements-dev.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Audit pinned and resolved dependencies
        run: pip-audit --strict -r "${{ matrix.requirements }}"
