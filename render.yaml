# Render deployment for the independent NEPSE AI Trading Platform.
# The original backend/database remain in place as a fallback.
services:
  - type: web
    name: nepse-ai-platform-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/amritpandit/Nepse-AI-Trading-Platform
    branch: main
    dockerContext: .
    dockerfilePath: infra/docker/api.Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: prod
      - key: SECRET_KEY
        generateValue: true
      # Set manually in Render so the database password is never committed or
      # replaced by future Blueprint syncs.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_CONNECT_TIMEOUT
        value: "5"
      - key: MLFLOW_ENABLED
        value: "false"
